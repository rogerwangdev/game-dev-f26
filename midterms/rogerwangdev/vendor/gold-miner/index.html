<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14100c">
<title>黄金矿工 · Gold Miner (Pure H5)</title>
<meta name="description" content="A faithful remake of the classic Gold Miner arcade game. Pure HTML5 Canvas, zero dependencies, zero asset files — every pixel and every sound is generated by code.">
<meta name="author" content="Lor3walker">
<link rel="canonical" href="https://lor3walker.github.io/gold-miner/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='13' fill='%2314100c'/><path d='M11 41 19 22 44 17 55 33 45 50 21 49z' fill='%23f2c14a' stroke='%238a5a1c' stroke-width='3' stroke-linejoin='round'/><path d='M19 22 30 33 44 17' fill='none' stroke='%23fff6cf' stroke-width='3' stroke-linejoin='round' opacity='.75'/><path d='M30 33 27 49' fill='none' stroke='%23b8842c' stroke-width='3'/></svg>">
<meta property="og:type" content="website">
<meta property="og:title" content="Gold Miner · Pure HTML5 Canvas remake">
<meta property="og:description" content="20 levels, a shop, dynamite and gem-bearing rocks — with zero dependencies and zero image or audio files.">
<meta property="og:url" content="https://lor3walker.github.io/gold-miner/">
<meta property="og:image" content="https://raw.githubusercontent.com/Lor3walker/gold-miner/main/screenshots/level-9.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="960" height="640"></canvas>

      <div class="sysbtns">
        <button class="sysbtn" data-act="mute">音效 开</button>
        <button class="sysbtn" data-act="music">音乐 开</button>
        <button class="sysbtn" data-act="pause">暂停</button>
      </div>

      <button id="btn-dyn" class="dynbtn hidden" data-act="dyn">引爆</button>

      <div id="overlay" class="overlay hidden">
        <div id="modal" class="modal"></div>
      </div>
    </div>

    <p class="hint">
      <kbd>空格</kbd> / <kbd>点击画面</kbd> 放下钩子
      <span>·</span> <kbd>D</kbd> 引爆炸药
      <span>·</span> <kbd>P</kbd> 暂停
      <span>·</span> <kbd>M</kbd> 静音
      <span>·</span> <kbd>N</kbd> 音乐
    </p>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/items.js"></script>
  <script src="js/level.js"></script>
  <script src="js/hook.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
